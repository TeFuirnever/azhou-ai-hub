name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag to create, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Materialize Super Caveman approval evidence
        env:
          APPROVAL_RECORD_B64: ${{ secrets.SUPER_CAVEMAN_APPROVAL_RECORD_B64 }}
          REVIEW_RECORD_B64: ${{ secrets.SUPER_CAVEMAN_REVIEW_RECORD_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          target = Path(os.environ["RUNNER_TEMP"])
          records = {
              "super-caveman-approval.json": os.environ.get("APPROVAL_RECORD_B64", ""),
              "super-caveman-review.json": os.environ.get("REVIEW_RECORD_B64", ""),
          }
          for name, encoded in records.items():
              if not encoded:
                  raise SystemExit(f"required Git-external evidence is unavailable: {name}")
              path = target / name
              path.write_bytes(base64.b64decode(encoded, validate=True))
              path.chmod(0o600)
          PY
      - name: Full deterministic gate
        env:
          SUPER_CAVEMAN_APPROVAL_RECORD: ${{ runner.temp }}/super-caveman-approval.json
          SUPER_CAVEMAN_REVIEW_RECORD: ${{ runner.temp }}/super-caveman-review.json
        run: python scripts/verify.py --promotion-evidence

  draft:
    name: Create draft
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag and create draft
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "draft releases may only be created from main (got $GITHUB_REF)" >&2
            exit 2
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag must match vMAJOR.MINOR.PATCH" >&2
            exit 2
          fi
          release_view_out="$RUNNER_TEMP/azhou-release-view.out"
          release_view_err="$RUNNER_TEMP/azhou-release-view.err"
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$release_view_out" 2>"$release_view_err"; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          else
            release_status=$?
            if ! grep -Eiq 'HTTP/.* 404' "$release_view_out"; then
              cat "$release_view_out" "$release_view_err" >&2
              echo "unable to determine whether release exists (gh exit $release_status)" >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --draft \
            --generate-notes
