name: Agent Skin owned point diagnostic

on:
  push:
    branches:
      - codex/agent-skin-owned-point-diagnostic-20261122

permissions:
  contents: read

jobs:
  agent-skin-macos:
    name: Synthetic opaque-hit probe
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Dream image validation dependency
        run: |
          python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Run Agent Skin startup and two-host lifecycle checks
        working-directory: packages/agent-skin
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          AZHOU_RUN_NATIVE_EVENT_ASSESSMENT: "1"
        run: |
          node --test tools/startup.test.mjs
          node --test tools/image-settings.test.mjs
          node --test tools/localization.test.mjs
          node --test tools/dream-theme-validator.test.mjs
          python -B tools/test-production-dream-style.py
          python -B tools/test-production-theme-package-preflight.py
          python -B tools/test-production-theme-library.py
          python -B tools/test-startup-build.py
          python -B tools/test-startup-browser-selection-cli.py
          node tools/test-image-settings-browser.mjs
          python -B tools/test-startup-payload-browser.py --native-window-ordering --out "$RUNNER_TEMP/agent-skin-browser-evidence"
      - name: Retain isolated startup functional evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skin-opaque-hit-evidence
          path: ${{ runner.temp }}/agent-skin-browser-evidence/native-window-ordering
          retention-days: 5
