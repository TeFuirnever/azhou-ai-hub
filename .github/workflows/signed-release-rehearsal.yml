name: Signed release rehearsal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Rehearsal tag for the draft release, e.g. signing-rehearsal-2026-09-13"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signing-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Keyless-sign and verify the skill manifest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Generate the per-skill manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          lines = []
          for skill in sorted(Path("skills").iterdir()):
              if not skill.is_dir():
                  continue
              digest = hashlib.sha256()
              for file in sorted(p for p in skill.rglob("*") if p.is_file()):
                  digest.update(f"{file.relative_to(skill.parent).as_posix()}:{hashlib.sha256(file.read_bytes()).hexdigest()}\n".encode("utf-8"))
              lines.append(f"{digest.hexdigest()}  skills/{skill.name}")
          Path("SKILL_SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(Path("SKILL_SHA256SUMS.txt").read_text(encoding="utf-8"))
          PY
      - name: Install the hash-pinned sigstore CLI
        run: |
          python -m pip install --quiet --require-hashes --only-binary=:all: -r .github/requirements/sigstore.txt
          python -m sigstore --version
      - name: Keyless-sign the manifest
        run: python -m sigstore sign --bundle SKILL_SHA256SUMS.txt.sigstore SKILL_SHA256SUMS.txt
      - name: Verify the signature identity
        run: >
          python -m sigstore verify identity
          --bundle SKILL_SHA256SUMS.txt.sigstore
          --cert-identity "https://github.com/TeFuirnever/azhou-ai-hub/.github/workflows/signed-release-rehearsal.yml@refs/heads/main"
          --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          SKILL_SHA256SUMS.txt
      - name: Transfer the verified signing artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-skill-manifest
          path: |
            SKILL_SHA256SUMS.txt
            SKILL_SHA256SUMS.txt.sigstore
          if-no-files-found: error
          retention-days: 1

  draft:
    name: Attach the verified manifest to a draft release
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve the verified signing artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-skill-manifest
      - name: Attach the signed manifest to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          bash scripts/draft_release.sh "$TAG" \
            --title "$TAG (signing rehearsal — draft)" \
            --notes "Keyless sigstore signing rehearsal (#225). Draft: not announced, not published. Assets: the per-skill SHA-256 manifest plus its sigstore bundle (keyless, OIDC-bound to this workflow)." \
            SKILL_SHA256SUMS.txt SKILL_SHA256SUMS.txt.sigstore
      - name: Receipt summary
        env:
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "# Signed-release rehearsal receipt"
            echo
            echo "- Manifest: SKILL_SHA256SUMS.txt (per-skill tree digests)"
            echo "- Signature: keyless sigstore (Fulcio OIDC, Rekor bundle SKILL_SHA256SUMS.txt.sigstore)"
            echo "- Identity bound to: this workflow file on refs/heads/main"
            echo "- Draft release tag: $TAG (unpublished)"
            echo "- Verify command: python -m sigstore verify identity --bundle SKILL_SHA256SUMS.txt.sigstore --cert-identity '<workflow uri>' --cert-oidc-issuer 'https://token.actions.githubusercontent.com' SKILL_SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"
