name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
      - name: Package manifests and POSIX lifecycle suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verify_packages.py

  pstack-native:
    name: pstack maintained package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install test dependencies
        working-directory: packages/pstack-agent-harness
        run: bun install --frozen-lockfile
      - name: Check generated files
        working-directory: packages/pstack-agent-harness
        run: bun tools/generate.mjs --check
      - name: Run maintained pstack checks
        working-directory: packages/pstack-agent-harness
        run: bun test tests/ --path-ignore-patterns '**/tests/pi/**'

  startup-animation-macos:
    name: Startup and Pet validation
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Pet test dependency
        run: python -m pip install --only-binary=:all: Pillow==12.3.0
      - name: Run isolated Pet validation and candidate import tests
        working-directory: packages/codex-startup-animation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B tools/test-codex-pet.py
          python -B tools/test-import-codex-pet.py
      - name: Run Agent Skin startup protocol checks
        working-directory: packages/agent-skin
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          AZHOU_RUN_NATIVE_EVENT_ASSESSMENT: "1"
        run: |
          node --test tools/startup.test.mjs
          node --test tools/image-settings.test.mjs
          node --test tools/localization.test.mjs
          python -B tools/test-startup-build.py
          node tools/test-image-settings-browser.mjs
          python -B tools/test-startup-payload-browser.py --out "$RUNNER_TEMP/agent-skin-browser-evidence"
          mkdir -p .build
          xcrun --sdk macosx swiftc -target "$(uname -m)-apple-macos13.0" \
            Native/App.swift Native/Wallpaper.swift -o .build/startup-app-compile \
            -framework AppKit -framework WebKit
      - name: Run pure wallpaper validation
        working-directory: packages/codex-startup-animation
        run: |
          mkdir -p .build
          xcrun --sdk macosx swiftc Native/Wallpaper.swift Native/WallpaperValidationTests.swift \
            -o .build/wallpaper-validation-tests -framework AppKit
          .build/wallpaper-validation-tests

  agent-skin-unit-coverage:
    name: Agent Skin full production UT coverage
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - name: Install unit coverage dependency
        run: python -m pip install --only-binary=:all: coverage==7.16.2 Pillow==12.3.0
      - name: Prepare isolated Bash unit tooling
        working-directory: packages/agent-skin
        run: python -B tools/test-setup-unit-tools.py --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Require 95 percent for every production language
        working-directory: packages/agent-skin
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B tools/test-coverage-policy.py
          python -B tools/test-functional-verdict.py
          python -B tools/test-bootstrap-unit-tools.py
          python -B tools/test-unit-coverage.py

  benchmarks:
    name: Benchmark integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Super Repo Pedant
        run: python benchmarks/super-repo-pedant/benchmark.py check
      - name: Excalidraw Diagram
        run: python benchmarks/super-excalidraw-diagram/ordinary-model-floor/benchmark.py check
      - name: Session Insights
        run: python benchmarks/super-session-insights/benchmark.py check

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Public repository contract
        run: python scripts/check_repository.py
      - name: Git whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git show --check --format= HEAD
          fi

  verify-windows:
    name: Verify on Windows
    # Enforced Windows leg of the deterministic gate. Flipped to Required by
    # win-13 after the last Windows-only divergences were root-caused and
    # fixed (evidence/windows-ci-receipt-2026-09-09.md).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Full deterministic gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python scripts/verify.py

  required:
    name: Required
    if: always()
    needs:
      - tests
      - benchmarks
      - policy
      - verify-windows
      - pstack-native
      - startup-animation-macos
      - agent-skin-unit-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TESTS_RESULT: ${{ needs.tests.result }}
      BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      WINDOWS_RESULT: ${{ needs.verify-windows.result }}
      PSTACK_RESULT: ${{ needs.pstack-native.result }}
      ANIMATION_RESULT: ${{ needs.startup-animation-macos.result }}
      AGENT_SKIN_COVERAGE_RESULT: ${{ needs.agent-skin-unit-coverage.result }}
    steps:
      - name: Require every CI gate
        run: |
          test "$TESTS_RESULT" = "success"
          test "$BENCHMARKS_RESULT" = "success"
          test "$POLICY_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$PSTACK_RESULT" = "success"
          test "$ANIMATION_RESULT" = "success"
          test "$AGENT_SKIN_COVERAGE_RESULT" = "success"
