name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Docs-only fast-lane detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          # Manual runs and any diff we cannot resolve take the full gate.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: with rename detection a code file renamed into
          # docs/ would report only the destination and hide the removal,
          # so Native/App.swift -> docs/App.swift would wrongly classify
          # as docs-only and skip the leg that compiles it.
          changed="$(git diff --name-only --no-renames "${BASE_SHA}...HEAD")"
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs-only: every changed path is Markdown, docs/ or evidence/.
          # The Ubuntu gates (policy, unit, benchmarks, pstack) always run;
          # only the heavy platform legs below may skip.
          non_docs="$(printf '%s\n' "$changed" | grep -v -E '(^|/)docs/|(^|/)evidence/|\.md$' || true)"
          if [ -n "$non_docs" ]; then
            printf 'Non-docs changed paths:\n%s\n' "$non_docs"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
      - name: Package manifests and POSIX lifecycle suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verify_packages.py

  site-build:
    name: Site build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Test site
        working-directory: site
        run: npm test
      - name: Build site
        working-directory: site
        run: npm run build

  source-library:
    name: Source library tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
          python-version: "3.11"
          enable-cache: false
      - name: Test source library
        working-directory: packages/source-library
        run: uv run --locked python -m unittest -v test_library

  agent-inspector:
    name: Azhou Agent Inspector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/azhou-agent-inspector
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Test ZCode adapter
        run: node --test test/*.test.mjs
      - name: Test Codex adapter
        run: python3 -B -m unittest discover -s test -p '*_test.py'
      - name: Exercise both UI bridges in Chrome
        run: node test/browser-smoke.mjs
      - name: Exercise ZCode dashboard and overlay HTTP routes
        run: node plugins/zcode/dashboard/overlay/smoke-test.mjs

  pstack-native:
    name: pstack maintained package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Build the harness trees
        working-directory: packages/pstack-agent-harness
        run: node tools/build-harness.mjs
      - name: Committed trees match a fresh build
        working-directory: packages/pstack-agent-harness
        run: |
          git diff --exit-code -- harness/
          untracked="$(git ls-files --others --exclude-standard -- harness/)"
          if [ -n "$untracked" ]; then
            printf 'Untracked generated harness files:\n%s\n' "$untracked" >&2
            exit 1
          fi
      - name: Install built pstack test dependencies
        working-directory: packages/pstack-agent-harness/harness/pstack/claude-code/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Strict TypeScript check for the built watcher
        working-directory: packages/pstack-agent-harness/harness/pstack/claude-code/skills/poteto-mode/scripts
        run: bun run typecheck
      - name: Run the built tree's script tests
        working-directory: packages/pstack-agent-harness/harness/pstack/claude-code/skills/poteto-mode/scripts
        run: bun test

  benchmarks:
    name: Benchmark integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Super Repo Pedant
        run: python benchmarks/super-repo-pedant/benchmark.py check
      - name: Excalidraw Diagram
        run: python benchmarks/super-excalidraw-diagram/ordinary-model-floor/benchmark.py check
      - name: Session Insights
        run: python benchmarks/super-session-insights/benchmark.py check

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Public repository contract
        run: python scripts/check_repository.py
      - name: Git whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git show --check --format= HEAD
          fi

  verify-windows:
    name: Verify on Windows
    # Enforced Windows leg of the deterministic gate. Flipped to Required by
    # win-13 after the last Windows-only divergences were root-caused and
    # fixed (evidence/windows-ci-receipt-2026-09-09.md). Skipped only for
    # docs-only changes; the aggregate job accepts that skip explicitly.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Managed lifecycle state-change regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -p test_azhou_hub_lifecycle_cli.py -v
      - name: Full deterministic gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python scripts/verify.py

  required:
    name: Required
    if: always()
    needs:
      - changes
      - tests
      - benchmarks
      - policy
      - verify-windows
      - pstack-native
      - agent-inspector
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      TESTS_RESULT: ${{ needs.tests.result }}
      BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      WINDOWS_RESULT: ${{ needs.verify-windows.result }}
      AGENT_INSPECTOR_RESULT: ${{ needs.agent-inspector.result }}
      PSTACK_RESULT: ${{ needs.pstack-native.result }}
    steps:
      - name: Require every CI gate
        run: |
          # The fast-lane detector itself must always have succeeded; a
          # failed detector must never read as an all-clear.
          test "$CHANGES_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$BENCHMARKS_RESULT" = "success"
          test "$POLICY_RESULT" = "success"
          test "$PSTACK_RESULT" = "success"
          test "$AGENT_INSPECTOR_RESULT" = "success"
          # Only a confirmed docs-only change can skip a platform gate.
          for result in "$WINDOWS_RESULT"; do
            case "$result" in
              success) ;;
              skipped) test "$DOCS_ONLY" = "true" || exit 1 ;;
              *) exit 1 ;;
            esac
          done
