name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
      - name: Package manifests and POSIX lifecycle suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verify_packages.py

  pstack-native:
    name: pstack native package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install Pi locally
        working-directory: packages/pstack-agent-harness
        run: |
          npm install --prefix "$RUNNER_TEMP/pstack-pi" --ignore-scripts --before=2026-10-11 \
            --cache "$RUNNER_TEMP/pstack-npm-cache" @earendil-works/pi-coding-agent@1.1.0
          echo "PI_PACKAGE_DIR=$RUNNER_TEMP/pstack-pi/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pstack-pi/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install test dependencies
        working-directory: packages/pstack-agent-harness
        run: bun install --frozen-lockfile
      - name: Check generated files
        working-directory: packages/pstack-agent-harness
        run: bun tools/generate.mjs --check
      - name: Run pstack tests
        working-directory: packages/pstack-agent-harness
        env:
          PSTACK_PI_REQUIRE_CATALOG: "1"
          PSTACK_PI_REQUIRE_RUNTIME: "1"
        run: bun test tests/
      - name: Typecheck the Pi extension
        working-directory: packages/pstack-agent-harness
        run: bun tools/typecheck-pi.mjs

  startup-animation-macos:
    name: Startup animation Swift validation
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pure wallpaper validation
        working-directory: packages/codex-startup-animation
        run: |
          mkdir -p .build
          xcrun --sdk macosx swiftc Native/Wallpaper.swift Native/WallpaperValidationTests.swift \
            -o .build/wallpaper-validation-tests -framework AppKit
          .build/wallpaper-validation-tests

  benchmarks:
    name: Benchmark integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Super Repo Pedant
        run: python benchmarks/super-repo-pedant/benchmark.py check
      - name: Excalidraw Diagram
        run: python benchmarks/super-excalidraw-diagram/ordinary-model-floor/benchmark.py check
      - name: Session Insights
        run: python benchmarks/super-session-insights/benchmark.py check

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Public repository contract
        run: python scripts/check_repository.py
      - name: Git whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git show --check --format= HEAD
          fi

  verify-windows:
    name: Verify on Windows
    # Enforced Windows leg of the deterministic gate. Flipped to Required by
    # win-13 after the last Windows-only divergences were root-caused and
    # fixed (evidence/windows-ci-receipt-2026-09-09.md).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Full deterministic gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python scripts/verify.py

  required:
    name: Required
    if: always()
    needs:
      - tests
      - benchmarks
      - policy
      - verify-windows
      - pstack-native
      - startup-animation-macos
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TESTS_RESULT: ${{ needs.tests.result }}
      BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      WINDOWS_RESULT: ${{ needs.verify-windows.result }}
      PSTACK_RESULT: ${{ needs.pstack-native.result }}
      ANIMATION_RESULT: ${{ needs.startup-animation-macos.result }}
    steps:
      - name: Require every CI gate
        run: |
          test "$TESTS_RESULT" = "success"
          test "$BENCHMARKS_RESULT" = "success"
          test "$POLICY_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$PSTACK_RESULT" = "success"
          test "$ANIMATION_RESULT" = "success"
