name: Fuzz

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-state:
    name: Fuzz the Super Lavish relay state parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run bounded fuzzer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '540' || '120' }}
        run: python scripts/fuzz_relay_state.py --seconds "$FUZZ_SECONDS" --seed "${GITHUB_RUN_ID:-20260902}"
