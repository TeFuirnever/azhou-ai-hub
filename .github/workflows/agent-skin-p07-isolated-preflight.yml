name: Agent Skin P07 formal synthetic measurement

on:
  push:
    branches:
      - codex/agent-skin-p07-isolated-preflight-20261121

permissions:
  contents: read

jobs:
  measurement:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - name: Checkout the matching isolated probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: lab
          persist-credentials: false
      - name: Checkout the pinned evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6f604ad2b35b7a5e14958f1404645b2caed5b006
          path: evaluator
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Register and run only preflight and displacement controls
        shell: bash
        working-directory: evaluator
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f604ad2b35b7a5e14958f1404645b2caed5b006"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install --only-binary=:all: Pillow==12.3.0
          chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          out="$RUNNER_TEMP/p07-isolated"
          mkdir "$out"
          python -B ../lab/.github/p07/chrome_identity.py "$chrome" >"$out/chrome-identity.json" 2> >(tee "$out/chrome-identity.stderr" >&2)
          browser="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["browser"])' "$out/chrome-identity.json")"
          printf 'Measurement Browser: %s\n' "$browser"
          tool=packages/agent-skin/tools
          python -B "$tool/test-theme-readability-measurement.py" --register "$out/registration" --browser-version "$browser" --node-version "$(node --version)"
          python -B "$tool/test-startup-payload-browser.py" --chrome "$chrome" --theme-protocol "$out/registration/train-0.json" --measurement-preflight --out "$out/preflight"
          python -B "$tool/test-startup-payload-browser.py" --chrome "$chrome" --theme-protocol "$out/registration/train-0.json" --only 'generated measurement scene detects actual image displacement in four conditions' --out "$out/displacement"
          python -c 'import json,sys; expected=json.load(open(sys.argv[1])); actual=json.load(open(sys.argv[2]))["environment"]; assert (actual["browser"],actual["protocolVersion"]) == (expected["browser"],expected["protocolVersion"])' "$out/chrome-identity.json" "$out/displacement/report.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Collect fresh training and independent holdout
        shell: bash
        working-directory: evaluator
        timeout-minutes: 45
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          export P07_EVIDENCE="$RUNNER_TEMP/p07-isolated"
          export P07_CHROME='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          bash ../lab/.github/p07/collect.sh
      - name: Retain synthetic evidence, including failed stages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skin-p07-formal-measurement
          compression-level: 0
          path: ${{ runner.temp }}/p07-isolated
          retention-days: 5
