name: Agent Skin P07 isolated measurement controls

on:
  push:
    branches:
      - codex/agent-skin-p07-isolated-preflight-20261121

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the pinned evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6f604ad2b35b7a5e14958f1404645b2caed5b006
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Register and run only preflight and displacement controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f604ad2b35b7a5e14958f1404645b2caed5b006"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m pip install --only-binary=:all: Pillow==12.3.0
          chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          browser="$("$chrome" --version | sed -nE 's/^Google Chrome ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$/Chrome\/\1/p')"
          test -n "$browser"
          out="$RUNNER_TEMP/p07-isolated"
          mkdir "$out"
          tool=packages/agent-skin/tools
          python -B "$tool/test-theme-readability-measurement.py" --register "$out/registration" --browser-version "$browser" --node-version "$(node --version)"
          python -B "$tool/test-startup-payload-browser.py" --chrome "$chrome" --theme-protocol "$out/registration/train-0.json" --measurement-preflight --out "$out/preflight"
          python -B "$tool/test-startup-payload-browser.py" --chrome "$chrome" --theme-protocol "$out/registration/train-0.json" --only 'generated measurement scene detects actual image displacement in four conditions' --out "$out/displacement"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain synthetic control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skin-p07-isolated-preflight
          path: ${{ runner.temp }}/p07-isolated
          retention-days: 5
