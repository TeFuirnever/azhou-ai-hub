name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    permissions:
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # pstack/ is vendored upstream and harness/ its generated copies;
          # the quilt patch queue governs defects there, not code scanning.
          config: |
            paths-ignore:
              - packages/pstack-agent-harness/pstack/**
              - packages/pstack-agent-harness/harness/**
              # skills/super-diagram-design/** is vendored upstream at the pinned
              # commit (VENDORED_SKILL_PACKAGES in scripts/check_repository.py);
              # findings in upstream's own bytes stay upstream's.
              - skills/super-diagram-design/**
              # skills/super-brainstorming/** keeps its upstream instruction body
              # and companion scripts verbatim outside the recorded deltas;
              # findings in upstream's own bytes stay upstream's.
              - skills/super-brainstorming/**
      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
