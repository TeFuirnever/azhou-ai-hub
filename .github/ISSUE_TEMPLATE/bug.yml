name: Bug report
description: Report a reproducible skill, script, documentation, or benchmark defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove secrets, raw private conversations, user paths, and unpublished assets. Security or privacy exposure belongs in a private advisory.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - repo-pedant
        - excalidraw-diagram
        - benchmarks or tests
        - installation or documentation
        - GitHub automation
        - other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Release tag or full Git commit used for the reproduction.
      placeholder: v0.1.0 or 40-character SHA
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and model
      description: Include harness version and model when agent behavior is involved.
      placeholder: Codex Desktop / model; Claude Code / model; zcode / model
    validations:
      required: false
  - type: textarea
    id: task
    attributes:
      label: Minimal real task
      description: The smallest redacted input or synthetic fixture that reproduces the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the first failing gate, exit code, and redacted receipt or log.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction commands
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data boundary
      options:
        - label: I removed secrets, private conversations, personal paths, identities, and unpublished assets.
          required: true
        - label: This report does not describe an unpatched security or privacy vulnerability.
          required: true
