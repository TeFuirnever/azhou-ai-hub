name: Bug report
description: Report a reproducible skill, script, documentation, or benchmark defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove secrets, raw private conversations, user paths, and unpublished assets. Security or privacy exposure belongs in a private advisory.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - super-repo-pedant
        - super-excalidraw-diagram
        - benchmarks or tests
        - installation or documentation
        - GitHub automation
        - other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Include the release tag or Git commit if you know it.
      placeholder: Release tag or full commit SHA
    validations:
      required: false
  - type: input
    id: harness
    attributes:
      label: Agent host and model
      description: Include the host, its version, and the model if you know them and the bug involved an agent.
      placeholder: Codex Desktop, Claude Code, or ZCode
    validations:
      required: false
  - type: textarea
    id: task
    attributes:
      label: What did you do?
      description: Give the steps and a small redacted example if it helps reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: If you saw an error, include the first message and redact any private details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction commands (if applicable)
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Data boundary
      options:
        - label: I removed secrets, private conversations, personal paths, identities, and unpublished assets.
          required: true
        - label: This report does not describe an unpatched security or privacy vulnerability.
          required: true
