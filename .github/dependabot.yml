version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /skills/super-excalidraw-diagram/scripts
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - super-excalidraw-diagram
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /skills/super-excalidraw-diagram/references
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - super-excalidraw-diagram
    open-pull-requests-limit: 5
