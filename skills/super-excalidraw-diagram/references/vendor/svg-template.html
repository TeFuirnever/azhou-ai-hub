<!DOCTYPE html>
<html>
<body>
  <script type="module">
    import { convertSvg } from "./excalidraw-all.esm.js";

    window.convertSvgText = function (svgText) {
      try {
        const result = convertSvg(svgText);
        if (result && result.hasErrors) {
          window.__done = true;
          return { ok: false, error: "svg has invalid nodes", content: null };
        }
        window.__done = true;
        return { ok: true, content: (result && result.content) || null };
      } catch (err) {
        window.__done = true;
        return { ok: false, error: String(err), content: null };
      }
    };
    window.__ready = true;
  </script>
</body>
</html>
