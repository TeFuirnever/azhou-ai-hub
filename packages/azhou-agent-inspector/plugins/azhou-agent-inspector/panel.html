<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阿舟 Agent 工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      --motion-press: 100ms;
      --motion-feedback: 120ms;
      --motion-change: 160ms;
      --motion-ease: cubic-bezier(.23, 1, .32, 1);
      font: 100%/1.5 system-ui, sans-serif;
      --background: light-dark(#f9f4ee, #211a1c);
      --surface: light-dark(#fff8ef, #302628);
      --ink: light-dark(#2e241f, #fff2e7);
      --muted: light-dark(#55463e, #e0d0c6);
      --accent: light-dark(#81400f, #ffc185);
      --line: light-dark(#dbcbbc, #685454);
      --scrim-start: light-dark(rgb(249 244 238 / 94%), rgb(27 21 23 / 92%));
      --scrim-end: light-dark(rgb(249 244 238 / 82%), rgb(27 21 23 / 69%));
    }

    * { box-sizing: border-box; }
    body {
      min-block-size: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--background);
      background-image:
        linear-gradient(110deg, var(--scrim-start), var(--scrim-end)),
        url("data:image/webp;base64,__WALLPAPER__");
      background-position: center, 72% center;
      background-size: cover;
      background-repeat: no-repeat;
    }
    @media (forced-colors: active) {
      body { background-image: none; }
    }
    [hidden] { display: none !important; }
    main { max-inline-size: 40rem; margin-inline: auto; padding: clamp(0.75rem, 4vw, 1.5rem); }
    header, .brand { display: flex; align-items: center; gap: 0.625rem; }
    header { flex-wrap: wrap; justify-content: space-between; }
    .brand { flex: 1 1 10rem; min-inline-size: 0; }
    .brand img { flex: none; inline-size: 40px; block-size: 40px; border-radius: 0.5rem; }
    h1 { margin: 0; font-size: 1rem; font-weight: 650; overflow-wrap: anywhere; }
    button {
      min-block-size: 2.25rem;
      padding: 0.25em 0.65em;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.875rem;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
    }
    @media (hover: hover) and (pointer: fine) {
      button:not([aria-disabled="true"]):hover { border-color: var(--muted); }
    }
    button:not([aria-disabled="true"]):active { border-color: var(--accent); }
    button[aria-disabled="true"] { color: var(--muted); cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .status, .feedback, .round, dt, footer { font-size: 0.8125rem; color: var(--muted); }
    .status { margin: 1rem 0 0.625rem; }
    .status[data-state="running"] { color: var(--accent); }
    .feedback { min-block-size: 1.5em; margin: 0 0 0.625rem; }
    .round { margin: 0 0 0.5rem; font-weight: 600; }
    dl, dd { margin: 0; }
    dd { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(8rem, 100%), 1fr));
      gap: 0.75rem 1rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: var(--surface);
    }
    .summary div { display: flex; flex-direction: column; }
    .summary dt { font-weight: 550; }
    .summary dd {
      margin-block-start: auto;
      padding-block-start: 0.15rem;
      font-size: clamp(1.25rem, 5vw, 1.5rem);
      font-weight: 650;
      line-height: 1.25;
    }
    .summary .rate { color: var(--accent); }

    .details {
      margin-block-start: 0.5rem;
      padding-inline: 0.75rem;
      border-radius: 0.5rem;
      background: color-mix(in srgb, var(--surface) 56%, transparent);
    }
    .details div {
      display: grid;
      grid-template-columns: minmax(0, 1fr) fit-content(54%);
      align-items: baseline;
      gap: 0.5rem;
      padding-block: 0.5rem;
    }
    .details div + div { border-block-start: 1px solid var(--line); }
    .details dd { min-inline-size: 0; font-size: 0.875rem; text-align: end; }
    .performance { margin-block-start: 0.625rem; font-size: 0.875rem; }
    .performance summary { cursor: pointer; width: fit-content; padding: 0.25rem; }
    .performance summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      transition: border-color var(--motion-feedback) var(--motion-ease),
                  color var(--motion-feedback) var(--motion-ease),
                  transform var(--motion-feedback) var(--motion-ease);
    }
    .feedback { transition: opacity var(--motion-change) var(--motion-ease); }
    .feedback:empty { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      button:not([aria-disabled="true"]):active {
        transform: scale(.98); transition-duration: var(--motion-press);
      }
    }
    footer { margin-block-start: 1rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img alt="" width="40" height="40" src="data:image/webp;base64,__ART__">
        <h1>阿舟 Agent 工作台</h1>
      </div>
      <button type="button" id="refresh" aria-label="刷新会话数据">刷新</button>
    </header>
    <p id="state" class="status" role="status">正在读取当前会话…</p>
    <p id="feedback" class="feedback" role="status"></p>
    <section id="snapshot" aria-label="性能指标" hidden>
      <h2 id="round" class="round" hidden>数据来自上一已完成轮</h2>
      <dl class="summary">
        <div><dt>耗时（含工具）</dt><dd data-metric="durationMs"></dd></div>
        <div><dt>整轮输出吞吐</dt><dd class="rate" data-metric="effectiveTps"></dd></div>
      </dl>
      <details class="performance" hidden>
        <summary id="performance">性能详情</summary>
        <dl class="details">
          <div><dt>首个 token 等待</dt><dd data-metric="ttftMs"></dd></div>
          <div><dt>缓存命中</dt><dd data-metric="cacheHitPercent"></dd></div>
          <div><dt>Context 占用</dt><dd data-metric="contextUsagePercent"></dd></div>
          <div><dt>输出 tokens</dt><dd data-metric="outputTokens"></dd></div>
          <div><dt>模型响应数</dt><dd data-metric="responses"></dd></div>
        </dl>
      </details>
    </section>
    <footer>Azhou artwork © 小亮（阿舟 / Azhou） · CC BY-NC-ND 4.0</footer>
  </main>
  <script>
    const notices = {
      unbound: "宿主未提供可核对的会话身份。",
      unavailable: "未找到唯一匹配的本地会话记录。",
      running: "本轮进行中，完成后可刷新。",
      interrupted: "本轮已中断。",
      complete: "最近完成的一轮",
      empty: "此会话尚无可用的轮次统计。",
    };

    const state = document.querySelector("#state");
    const snapshot = document.querySelector("#snapshot");
    const round = document.querySelector("#round");
    const refresh = document.querySelector("#refresh");
    const feedback = document.querySelector("#feedback");
    const performanceToggle = document.querySelector("#performance");
    const performanceDetails = performanceToggle.parentElement;
    const performanceRows = performanceDetails.querySelectorAll("dl > div");
    const number = new Intl.NumberFormat(document.documentElement.lang, { maximumFractionDigits: 1 });
    const decimal = new Intl.NumberFormat(document.documentElement.lang, {
      minimumFractionDigits: 1, maximumFractionDigits: 1,
    });
    const seconds = milliseconds => {
      const tenths = Math.round(milliseconds / 100);
      const minutes = Math.floor(tenths / 600);
      const remainder = decimal.format((tenths % 600) / 10) + " 秒";
      return minutes ? number.format(minutes) + " 分 " + remainder : remainder;
    };
    const formats = {
      durationMs: seconds,
      effectiveTps: value => number.format(value) + " tok/s",
      ttftMs: seconds,
      cacheHitPercent: value => number.format(value) + "%",
      contextUsagePercent: value => number.format(value) + "%",
      outputTokens: value => number.format(value),
      responses: value => number.format(value),
    };
    const metrics = document.querySelectorAll("[data-metric]");

    let revision = 0;
    let feedbackReset;
    function acceptSnapshot(data, clearFeedback = true) {
      if (data !== null && !Object.hasOwn(notices, data?.state)) return false;

      revision += 1;
      const status = data?.state ?? "";
      const sample = status === "complete" ? data : data?.lastCompleted;
      state.dataset.state = status;
      const notice = notices[status] ?? "尚未收到宿主数据。";
      if (state.textContent !== notice) state.textContent = notice;
      snapshot.hidden = !sample;
      round.hidden = status === "complete";
      for (const metric of metrics) {
        const key = metric.dataset.metric;
        const value = sample?.[key];
        const text = Number.isFinite(value) ? formats[key](value) : "—";
        if (metric.textContent !== text) metric.textContent = text;
      }
      for (const row of performanceRows) {
        row.hidden = !Number.isFinite(sample?.[row.querySelector("dd").dataset.metric]);
      }
      const visibleRows = Array.from(performanceRows).filter(row => !row.hidden);
      performanceDetails.hidden = visibleRows.length === 0;
      performanceToggle.title = visibleRows.map(row => {
        const [term, value] = row.children;
        return term.textContent + " " + value.textContent;
      }).join("\n");
      if (clearFeedback) {
        clearTimeout(feedbackReset);
        feedback.textContent = "";
      }
      return true;
    }

    let sequence = 0;
    let ready = false;
    const pending = new Map();
    function rpc(method, params) {
      const id = ++sequence;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pending.delete(id);
          reject(Error("timeout"));
        }, 8000);
        pending.set(id, { resolve, reject, timer });
        parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
    }

    window.addEventListener("message", event => {
      if (event.source !== parent || event.data?.jsonrpc !== "2.0") return;
      const message = event.data;
      if (message.method === "ui/notifications/tool-result") {
        acceptSnapshot(message.params?.structuredContent);
      }
      const request = pending.get(message.id);
      if (!request) return;
      clearTimeout(request.timer);
      pending.delete(message.id);
      if (message.error) request.reject(Error("host"));
      else request.resolve(message.result);
    });

    window.addEventListener("openai:set_globals", event => {
      acceptSnapshot(event.detail?.globals?.toolOutput);
    });

    async function update() {
      if (refresh.getAttribute("aria-disabled") === "true") return;
      const requestedAt = revision;
      clearTimeout(feedbackReset);
      refresh.setAttribute("aria-disabled", "true");
      feedback.textContent = "正在刷新…";
      try {
        let result;
        if (ready) result = await rpc("tools/call", { name: "session_performance", arguments: {} });
        else if (window.openai?.callTool) result = await window.openai.callTool("session_performance", {});
        else throw Error("offline");

        // A host push may already have replaced the visible session while the call was pending.
        if (revision === requestedAt) {
          if (!acceptSnapshot(result?.structuredContent, false)) throw Error("missing snapshot");
          feedback.textContent = "已刷新。";
          feedbackReset = setTimeout(() => { feedback.textContent = ""; }, 3500);
        }
      } catch {
        if (revision === requestedAt) {
          feedback.textContent = snapshot.hidden ? "刷新失败，请重试。" : "刷新失败，仍显示上次数据。";
        }
      } finally {
        refresh.removeAttribute("aria-disabled");
      }
    }

    refresh.addEventListener("click", update);
    acceptSnapshot(window.openai?.toolOutput);
    if (parent !== window) {
      rpc("ui/initialize", {
        appInfo: { name: "azhou-agent-inspector", version: __PLUGIN_VERSION__ },
        protocolVersion: "2026-01-26",
        appCapabilities: {},
      }).then(() => {
        ready = true;
        parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
      }).catch(() => {
        if (!revision) acceptSnapshot(null);
      });
    } else if (!revision) {
      acceptSnapshot(null);
    }
  </script>
</body>
</html>
