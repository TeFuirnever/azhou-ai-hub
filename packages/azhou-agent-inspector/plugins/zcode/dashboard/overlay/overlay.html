<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>TPS 悬浮窗</title>
<style>
  /* DSH 风格紧凑小框:卡片约 330×184、单行条约 620×40(?style=line);
     body 零边距零滚动;配色对齐监控大屏(index.html)。零外部资源(无 CDN/字体/图片),
     系统字体栈；卡片和单行模式均在 WKWebView 中运行。 */
  :root {
    color-scheme: dark light;
    --motion-press: 100ms;
    --motion-feedback: 140ms;
    --motion-change: 180ms;
    --motion-ease: cubic-bezier(.23, 1, .32, 1);
    --bg: #0b1020; --ink: #e8ecf7; --muted: #aab3cf; --secondary: #8b94ad;
    --surface: #141b33; --hover: #1d2747; --pressed: #26325a;
    --line: #2a3350; --active-line: #3a4774; --accent: #7ea2ff;
    --live: #2fd67b; --error: #ff9aa6;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fc; --ink: #172144; --muted: #35446a; --secondary: #506080;
      --surface: #fff; --hover: #e9efff; --pressed: #dae5ff;
      --line: #a9b5d0; --active-line: #687ca7; --accent: #345db4;
      --live: #146447; --error: #a02744;
    }
  }
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }
  .wrap { box-sizing: border-box; width: 100%; height: 100%; padding: 10px 14px 12px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); margin-right: 6px; }
  .top[data-state="active"] .dot { background: var(--live); }
  .top[data-state="error"] .dot { background: var(--error); }
  .state { font-size: 12px; color: var(--secondary); white-space: nowrap; }
  .top[data-state="active"] .state { color: var(--live); }
  .top[data-state="error"] .state { color: var(--error); }
  .main { display: flex; align-items: baseline; margin-top: 4px; white-space: nowrap; }
  .bolt { font-size: 24px; margin-right: 7px; }
  .num { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .num.off { color: var(--secondary); }
  .unit { font-size: 13px; color: var(--secondary); margin-left: 6px; }
  .scope { margin-left: auto; font-size: 11px; color: var(--secondary); }
  .info { margin-top: auto; font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

  /* 交互按钮区:悬浮在右上角(单行模式垂直居中)。面板的透明拖动层只覆盖左侧,
     右侧 120pt 不覆盖(见 OverlayPanel.swift),按钮可点击、其余区域按住拖动。 */
  .ctrls { position: absolute; top: 8px; right: 8px; display: flex; }
  .cbtn {
    width: 30px; height: 30px; margin-left: 5px; padding: 0; box-sizing: border-box;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--muted);
    font-size: 12px; line-height: 20px; text-align: center;
    cursor: pointer; -webkit-user-select: none;
  }
  @media (hover: hover) and (pointer: fine) {
    .cbtn:not([aria-disabled="true"]):hover { background: var(--hover); border-color: var(--active-line); color: var(--ink); }
  }
  .cbtn:not([aria-disabled="true"]):active { background: var(--pressed); }
  .cbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cbtn[aria-disabled="true"] { opacity: .55; cursor: default; }
  .cbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--active-line); }
  #btnPause { display: grid; place-items: center; }
  #btnPause span { grid-area: 1 / 1; }
  #btnPause[aria-pressed="false"] .resume-icon,
  #btnPause[aria-pressed="true"] .pause-icon { opacity: 0; }

  /* 速率曲线(卡片模式,点 📈 开关):细 sparkline,高约 26px */
  .spark { flex: none; margin-top: 6px; width: 100%; height: 26px; opacity: 0; }
  .spark.on { opacity: 1; }
  .spark polyline { stroke: var(--accent); }

  /* 单行模式(?style=line):一条细横条,配合面板 --size 620x40 贴在输入框上方 */
  body.line { border-radius: 8px; }
  body.line .wrap { flex-direction: row; align-items: center; padding: 0 82px 0 12px; }
  body.line .top { flex: none; margin-right: 10px; }
  body.line .bolt { font-size: 15px; margin-right: 4px; }
  body.line .num { font-size: 20px; letter-spacing: 0; }
  body.line .unit { font-size: 11px; margin: 0 10px 0 4px; }
  body.line .scope { margin-left: 0; font-size: 10px; margin-right: 10px; }
  body.line .info { margin: 0 0 0 4px; }
  body.line .ctrls { top: 50%; right: 8px; transform: translateY(-50%); }
  body.line :is(#btnSpark, .spark) { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .dot { transition: background-color var(--motion-feedback) ease; }
    .cbtn {
      transition: border-color var(--motion-feedback) ease, background-color var(--motion-feedback) ease,
                  color var(--motion-feedback) ease, opacity var(--motion-feedback) ease,
                  transform var(--motion-feedback) var(--motion-ease);
    }
    .cbtn:not([aria-disabled="true"]):active { transform: scale(.98); transition-duration: var(--motion-press); }
    #btnPause span { transition: opacity var(--motion-feedback) var(--motion-ease); }
    .spark { transform: translateY(3px); transition: opacity var(--motion-change) var(--motion-ease),
                                                       transform var(--motion-change) var(--motion-ease); }
    .spark.on { transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top" id="statusGroup">
      <span class="dot" aria-hidden="true"></span>
      <span class="state" id="state" role="status">连接中…</span>
    </div>
    <div class="main">
      <span class="bolt">&#9889;</span><span class="num off" id="num">--</span><span class="unit">tok/s</span>
      <span class="scope" id="scope"></span>
    </div>
    <div class="info" id="info">等待数据…</div>
    <svg class="spark" id="spark" viewBox="0 0 300 26" preserveAspectRatio="none" aria-hidden="true">
      <polyline id="sparkline" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="ctrls">
      <button class="cbtn" id="btnRefresh" type="button" aria-label="立即刷新一次" title="立即刷新一次">&#8635;</button>
      <button class="cbtn" id="btnPause" type="button" aria-label="暂停自动刷新" aria-pressed="false" title="暂停自动刷新">
        <span class="pause-icon" aria-hidden="true">&#9208;</span>
        <span class="resume-icon" aria-hidden="true">&#9654;</span>
      </button>
      <button class="cbtn" id="btnSpark" type="button" aria-label="速率曲线" aria-pressed="false" title="显示速率曲线">&#128200;</button>
    </div>
  </div>
<script>
(function () {
  "use strict";
  // 单行模式:URL 带 style=line 时切换为细横条布局(配合面板 --size 参数)
  var lineMode = /style=line/.test(location.search);
  if (lineMode) {
    document.documentElement.className += " line";
    document.body.className += " line";
  }
  var $ = function (id) { return document.getElementById(id); };
  var busy = false;
  var paused = false;   // 暂停自动刷新(手动 ↻ 仍可拉取)
  var sparkOn = false;  // 速率曲线开关(卡片模式)
  var lastData;
  var connectionFailed = false;
  var manualRefresh = false;

  // 紧凑单位:千以下原始、千~万一位小数 k、万~百万取整 k、百万以上一位小数 M(与 token-rate.mjs 的 fmtCompact 一致)
  function fmtCompact(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
    if (n >= 10000) return Math.round(n / 1000) + "k";
    if (n >= 1000) return (n / 1000).toFixed(1) + "k";
    return String(n);
  }
  function fmtNum(n) { return Number(n).toLocaleString("en-US"); }
  function fmtSec(ms) { return ms != null && isFinite(ms) ? (ms / 1000).toFixed(1) + "s" : "-"; }

  // 速率曲线:history 为旧→新的 tok/s 数组,映射到 300×26 的 viewBox
  function drawSpark(hist) {
    var poly = $("sparkline");
    if (!sparkOn || !hist || hist.length < 2) { poly.setAttribute("points", ""); return; }
    var min = Math.min.apply(null, hist);
    var max = Math.max.apply(null, hist);
    var span = max - min || 1;
    var pts = [];
    for (var i = 0; i < hist.length; i++) {
      var x = (i / (hist.length - 1)) * 300;
      var y = 22 - ((hist[i] - min) / span) * 18;
      pts.push(x.toFixed(1) + "," + y.toFixed(1));
    }
    poly.setAttribute("points", pts.join(" "));
  }

  function renderStatus() {
    var st = lastData && lastData.status;
    var on = !paused && !connectionFailed && st === "generating";
    $("statusGroup").dataset.state = manualRefresh ? "pending" : connectionFailed ? "error" : on ? "active" : "idle";
    var state = $("state");
    var label = manualRefresh ? (paused ? "暂停中 · 刷新中…" : "正在刷新…")
      : connectionFailed ? (paused ? "暂停中 · 刷新失败" : "连接中断")
      : paused ? "已暂停"
      : on ? "生成中"
      : st === "idle" ? "空闲"
      : lastData ? "无数据" : "连接中…";
    if (state.textContent !== label) state.textContent = label;
  }

  function render(d) {
    var st = d && d.status ? d.status : "no-data";

    // 主数字:优先本轮(turn),无本轮数据时退回上轮(latest)并把标注从「本轮」换成「上轮」
    var t = d ? d.turn : null;
    var l = d ? d.latest : null;
    var s = d ? d.session : null;
    var src = null;
    if (t && (t.tokPerSec != null || t.totalOutput != null)) src = t;
    else if (l) src = l;
    if (src) {
      $("num").textContent = src.tokPerSec != null ? src.tokPerSec : "--";
      $("num").className = src.tokPerSec != null ? "num" : "num off";
      $("scope").textContent = src === t ? "本轮" : "上轮";
    } else {
      $("num").textContent = "--";
      $("num").className = "num off";
      $("scope").textContent = "";
    }

    // 统计小字:单行模式空间有限,只留输出与累计;卡片模式给全量
    var cum = s ? fmtCompact((s.totalOutput || 0) + (s.totalReasoning || 0)) : "-";
    if (lineMode) {
      if (src) {
        var out = src === t ? (t.totalOutput || 0) + (t.totalReasoning || 0) : (l.outputTokens || 0) + (l.reasoningTokens || 0);
        $("info").textContent = "输出 " + fmtNum(out) + " · 累计 " + cum;
      } else {
        $("info").textContent = "暂无会话数据";
      }
    } else if (t) {
      $("info").textContent =
        "首字 " + fmtSec(t.ttftMs) +
        " · 输出 " + fmtNum((t.totalOutput || 0) + (t.totalReasoning || 0)) + " tok" +
        " · 累计 " + cum +
        " · " + t.requests + " 段";
    } else if (l) {
      $("info").textContent =
        "首字 " + fmtSec(l.ttftMs) +
        " · 输出 " + fmtNum((l.outputTokens || 0) + (l.reasoningTokens || 0)) + " tok" +
        " · 累计 " + cum +
        " · - 段";
    } else {
      $("info").textContent = st === "no-data" ? "暂无会话数据" : "等待数据…";
    }

    drawSpark(d ? d.history : null);
  }

  // 每秒增量刷新;上一拍未返回时跳过本拍,避免请求堆积(页面可能被系统挂起后恢复);
  // 暂停时不再轮询(点 ↻ 可立即手动拉一次)
  function tick(manual) {
    if (busy) return;
    busy = true;
    if (manual) {
      manualRefresh = true;
      renderStatus();
    }
    $("btnRefresh").setAttribute("aria-disabled", "true");
    fetch("/api/live", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("Overlay data unavailable");
        return r.json();
      })
      .then(function (data) {
        if (paused && !manual) return;
        render(data);
        lastData = data;
        connectionFailed = false;
      })
      .catch(function () { if (!paused || manual) connectionFailed = true; })
      .then(function () {
        busy = false;
        manualRefresh = false;
        $("btnRefresh").removeAttribute("aria-disabled");
        renderStatus();
      });
  }

  // 交互按钮:立即刷新 / 暂停自动刷新 / 曲线开关(曲线仅卡片模式显示)
  $("btnRefresh").addEventListener("click", function () { tick(true); });
  $("btnPause").addEventListener("click", function () {
    paused = !paused;
    $("btnPause").setAttribute("aria-pressed", String(paused));
    $("btnPause").title = paused ? "恢复自动刷新" : "暂停自动刷新";
    renderStatus();
    if (!paused) tick();
  });
  $("btnSpark").addEventListener("click", function () {
    sparkOn = !sparkOn;
    $("btnSpark").setAttribute("aria-pressed", String(sparkOn));
    $("btnSpark").title = sparkOn ? "隐藏速率曲线" : "显示速率曲线";
    $("spark").classList.toggle("on", sparkOn);
    drawSpark(lastData && lastData.history);
  });

  tick();
  setInterval(function () { if (!paused) tick(); }, 1000);
})();
</script>
</body>
</html>
