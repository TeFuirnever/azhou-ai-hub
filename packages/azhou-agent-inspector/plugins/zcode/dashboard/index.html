<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>阿舟 Agent 工作台 · ZCode</title>
<script>
  /* 主题预置:样式应用前读持久化选择,避免日间用户看到暗色闪屏 */
  try {
    var t = localStorage.getItem("zcode-tps-theme");
    if (t === "light" || (t !== "dark" && matchMedia("(prefers-color-scheme: light)").matches))
      document.documentElement.dataset.theme = "light";
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #211a1c; --ink: #fff2e7; --dim: #e0d0c6;
    --em: #ffc185; --bl: #9dc8f4; --am: #f6c76b; --rd: #ff9aa6;
    --hair: #685454; --hair2: #9b807e;
    --surface: #302628; --core: #382c2e; --core2: #463539;
    --scrim-start: rgb(27 21 23 / 92%); --scrim-end: rgb(27 21 23 / 69%);
    --motion-press: 100ms;
    --motion-feedback: 120ms;
    --motion-change: 160ms;
    --motion-ease: cubic-bezier(.23, 1, .32, 1);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --chart-grid: #564342;
    --chart-label: var(--dim);
    --chart-empty: var(--dim);
    --chart-soft: rgb(255 193 133 / 28%);
    --chart-avg: rgb(157 200 244 / 60%);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f9f4ee; --ink: #2e241f; --dim: #55463e;
    --em: #81400f; --bl: #295a91; --am: #765015; --rd: #a02744;
    --hair: #dbcbbc; --hair2: #a88774;
    --surface: #fff8ef; --core: #fbf0e5; --core2: #f3e2d1;
    --scrim-start: rgb(249 244 238 / 94%); --scrim-end: rgb(249 244 238 / 82%);
    --chart-grid: #e6d5c6;
    --chart-soft: rgb(129 64 15 / 22%);
    --chart-avg: rgb(41 90 145 / 60%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font: 100%/1.5 system-ui, sans-serif;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(110deg, var(--scrim-start), var(--scrim-end)), var(--wallpaper, none);
    background-position: center, 72% center;
    background-size: cover;
  }
  @media (forced-colors: active) {
    body::before { background-image: none; }
  }
  .shell { position: relative; z-index: 1; max-width: 1480px; margin: 0 auto; padding: clamp(0.75rem, 3vw, 1.5rem); }

  /* --- 头部 --- */
  .top { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.875rem; }
  .brand { display: flex; flex: 1 1 12rem; min-width: 0; align-items: center; gap: 0.625rem; }
  .brand img { flex: none; width: 40px; height: 40px; border-radius: 0.5rem; }
  h1 { font-size: clamp(1rem, 2.5vw, 1.375rem); font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
  .clockbox { margin-left: auto; text-align: right; }
  .clock { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ink); }
  .live { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 4px; font-size: 11px; color: var(--dim); }
  .live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .live[data-state="live"] .dot { background: var(--em); }
  .live[data-state="disconnected"] .dot { background: var(--rd); }

  /* --- 总览条 --- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr)); gap: 10px; margin: 22px 0 14px; }
  .chip { border: 1px solid var(--hair); background: var(--surface); border-radius: 0.75rem; }
  .chip .in {
    background: var(--core); border-radius: 14px; padding: 12px 16px;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .05);
  }
  .chip .k { font-size: 11px; color: var(--dim); letter-spacing: .04em; }
  .chip .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; margin-top: 3px; }
  .chip .v i { font-style: normal; font-size: 12px; color: var(--dim); margin-left: 4px; font-weight: 400; }
  .chip.em .v { color: var(--em); } .chip.bl .v { color: var(--bl); } .chip.am .v { color: var(--am); }

  .main {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 14px; align-items: start;
  }
  @media (max-width: 920px) { .main { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .clockbox { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .clockbox :is(.theme-toggle, .live) { margin: 0; }
  }

  .panel { min-width: 0; border: 1px solid var(--hair); background: var(--surface); border-radius: 0.75rem; }
  .panel .inner { padding: clamp(0.625rem, 2.5vw, 1rem); }
  .theme-toggle:focus-visible { outline: 2px solid var(--em); outline-offset: -2px; }
  .theme-toggle {
    display: block; margin: 0 0 8px auto; font: inherit; font-size: 11px; letter-spacing: .08em;
    color: var(--dim); background: var(--core); border: 1px solid var(--hair2); border-radius: 999px;
    padding: 4px 12px; cursor: pointer;
    min-inline-size: 5.75rem;
  }
  @media (hover: hover) and (pointer: fine) {
    .theme-toggle:hover { color: var(--ink); border-color: var(--dim); }
  }
  .theme-toggle:active { background: var(--core2); }

  /* 详情区 */
  .dhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dhead .nm { font-size: 1.125rem; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .state {
    font-size: 10px; letter-spacing: .14em; padding: 4px 11px; border-radius: 999px; font-weight: 600;
  }
  .state.gen { color: var(--em); border: 1px solid rgba(255, 183, 107, .3); background: rgba(255, 183, 107, .07); }
  .state.act { color: var(--bl); border: 1px solid rgba(96, 165, 250, .3); background: rgba(96, 165, 250, .07); }
  .state.idl { color: var(--dim); border: 1px solid var(--hair2); background: var(--core); }
  .dhead .mdl { font-size: 11px; color: var(--dim); }
  .session-dir { margin: 4px 0 0; font-size: 0.75rem; color: var(--dim); font-family: var(--mono); overflow-wrap: anywhere; }

  .hero {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(8rem, 100%), 1fr));
    gap: 0.75rem 1rem; padding: 0.75rem; margin-block: 0.75rem;
    border: 1px solid var(--hair); border-radius: 0.75rem; background: var(--core);
  }
  .hero div { display: flex; flex-direction: column; min-width: 0; }
  .hero dt { color: var(--dim); font-size: 0.8125rem; font-weight: 550; }
  .hero dd {
    margin-block-start: auto; padding-block-start: 0.15rem;
    font-size: clamp(1.25rem, 5vw, 1.5rem); font-weight: 650; line-height: 1.25;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .hero .rate { color: var(--em); }
  .hero .big.idl { color: var(--dim); }

  .dsub { color: var(--dim); font-size: 13px; margin: 6px 6px 0; }
  summary.dsub { cursor: pointer; width: fit-content; padding-block: .75rem; }
  summary.dsub:focus-visible { outline: 2px solid var(--em); outline-offset: 2px; }

  .dchips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(8rem, 100%), 1fr)); gap: 8px; margin-bottom: 0.75rem; }
  .dchips .c { border: 1px solid var(--hair); border-radius: 14px; padding: 10px 13px; background: rgba(255, 255, 255, .015); }
  .dchips .c .k { font-size: 10.5px; color: var(--dim); }
  .dchips .c .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; margin-top: 2px; }
  .dchips .c .v i { font-style: normal; font-size: 10px; color: var(--dim); font-weight: 400; margin-left: 3px; }

  .chartbox { border: 1px solid var(--hair); border-radius: 16px; background: var(--core); padding: 10px 8px 6px; }
  .chartbox .cap { display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; font-size: 10.5px; color: var(--dim); padding: 0 8px 6px; letter-spacing: .06em; }
  .chartbox .cap span:last-child { margin-left: auto; font-family: var(--mono); }
  #chart { width: 100%; height: 230px; display: block; }

  /* 系统条 */
  .sys { display: flex; gap: 0.75rem 1.5rem; flex-wrap: wrap; align-items: center; margin-top: 14px; padding: 13px 18px;
    border: 1px solid var(--hair); border-radius: 0.75rem; background: var(--surface); font-size: 12px; color: var(--dim); }
  .sys-readings { display: contents; }
  .sys b { color: var(--ink); font-weight: 600; font-family: var(--mono); font-variant-numeric: tabular-nums; margin-left: 5px; }
  .sys .meter { width: 84px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .07); overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 8px; }
  .sys .meter i {
    display: block; height: 100%; border-radius: 2px; background: var(--bl);
    transform: scaleX(0); transform-origin: left center;
  }
  .sys .meter.warn i { background: var(--am); } .sys .meter.crit i { background: var(--rd); }

  footer { text-align: center; color: var(--dim); opacity: .6; font-size: 11px; margin-top: 20px; letter-spacing: .04em; }
  .dsub dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); gap: 0.25rem 0.75rem; margin: 8px 0; }
  .dsub :is(dt, dd) { overflow-wrap: anywhere; }
  .dsub dd { color: var(--ink); font-variant-numeric: tabular-nums; text-align: end; }
  .theme-toggle {
    transition: border-color var(--motion-feedback) var(--motion-ease),
                background-color var(--motion-feedback) var(--motion-ease),
                color var(--motion-feedback) var(--motion-ease),
                transform var(--motion-feedback) var(--motion-ease);
  }
  .live .dot { transition: background-color var(--motion-feedback) var(--motion-ease); }
  @media (prefers-reduced-motion: no-preference) {
    .theme-toggle:active { transform: scale(.98); transition-duration: var(--motion-press); }
    .sys .meter i { transition: transform var(--motion-change) var(--motion-ease); }
    :is(body, .hero, .session-history, .sys) {
      transition: background-color var(--motion-change) var(--motion-ease),
                  border-color var(--motion-change) var(--motion-ease), color var(--motion-change) var(--motion-ease);
    }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <img id="brandPortrait" hidden alt="" width="40" height="40">
      <h1 data-i18n="heading">阿舟 Agent 工作台</h1>
    </div>
    <div class="clockbox">
      <button class="theme-toggle" id="themeBtn" type="button">🌙 夜间</button>
      <div class="clock" id="clock">--:--:--</div>
      <div class="live" id="live"><span class="dot"></span><span id="liveTxt" role="status">连接中</span></div>
    </div>
  </header>

  <div class="main">
    <section class="panel session-summary">
      <div class="inner">
        <div class="dhead">
          <span class="nm" id="dName" data-i18n="waiting">等待数据…</span>
          <span class="state idl" id="dState" hidden></span>
          <span class="mdl" id="dModel"></span>
        </div>
        <p class="session-dir" id="dDir" hidden></p>
        <dl class="hero" hidden>
          <div>
            <dt data-i18n="turnDuration">整轮用时</dt>
            <dd id="dDuration">—</dd>
          </div>
          <div>
            <dt id="dCap" data-i18n="turnRate">本轮即时速率</dt>
            <dd class="rate"><span class="big" id="dRate">—</span><span id="dRateUnit" hidden> tok/s</span></dd>
          </div>
        </dl>
        <details id="performanceDetails" hidden>
          <summary class="dsub" data-i18n="performanceDetails">性能详情</summary>
          <div class="dsub" id="dSub"></div>
        </details>
        <p class="dsub" id="dEmpty" data-i18n="noRequests" hidden>该会话还没有已完成的模型请求</p>
      </div>
    </section>
    <section class="panel session-history" hidden>
      <div class="inner">
        <div class="dchips">
          <div class="c"><div class="k" data-i18n="recentAvg">近段均值</div><div class="v" id="cAvg">--</div></div>
          <div class="c"><div class="k" data-i18n="recentPeak">近段峰值</div><div class="v" id="cMax">--</div></div>
          <div class="c"><div class="k" data-i18n="sessionOutput">会话累计输出</div><div class="v" id="cCum">--<i>tok</i></div></div>
          <div class="c"><div class="k" data-i18n="requests">会话请求数</div><div class="v" id="cReq">--<i data-i18n="requestUnit">次</i></div></div>
        </div>
        <div class="chartbox">
          <div class="cap"><span data-i18n="chart">生成速率曲线</span><span id="chartCap"></span></div>
          <canvas id="chart"></canvas>
        </div>
      </div>
    </section>
  </div>

  <div class="stats" hidden>
    <div class="chip"><div class="in"><div class="k" data-i18n="sessions24h">24h 内会话</div><div class="v" id="sTotal">--<i data-i18n="sessionUnit">个</i></div></div></div>
    <div class="chip em"><div class="in"><div class="k" data-i18n="generating">生成中</div><div class="v" id="sGen">--<i data-i18n="sessionUnit">个</i></div></div></div>
    <div class="chip bl"><div class="in"><div class="k" data-i18n="active10m">活跃(10 分钟内)</div><div class="v" id="sAct">--<i data-i18n="sessionUnit">个</i></div></div></div>
    <div class="chip am"><div class="in"><div class="k" data-i18n="allOutput">各会话累计输出</div><div class="v" id="sCum">--<i>tok</i></div></div></div>
  </div>

  <div class="sys" id="sys" hidden>
    <span id="resourceStatus" role="status">本机资源</span>
    <div class="sys-readings" id="resourceReadings" hidden>
      <span>CPU<b id="cpu">--%</b><span class="meter" id="cpuBar"><i></i></span></span>
      <span><span data-i18n="memory">内存</span><b id="mem">--</b><span class="meter" id="memBar"><i></i></span></span>
      <span><span data-i18n="uptime">运行</span><b id="up">--</b></span>
      <span id="plat"></span>
    </div>
  </div>

  <footer data-i18n="footer">每秒刷新 · 数据源:ZCode usage 数据库(真实)· 各会话独立统计 · 隐藏标签页时自动暂停</footer>
  <small>Azhou artwork © 小亮（阿舟 / Azhou） · CC BY-NC-ND 4.0</small>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const translations = {
  "zh-CN": {
    title: "阿舟 Agent 工作台 · ZCode",
    heading: "阿舟 Agent 工作台",
    turnDuration: "整轮用时",
    night: "🌙 夜间",
    day: "☀️ 日间",
    switchNight: "切换到夜间模式",
    switchDay: "切换到日间模式",
    connecting: "连接中",
    live: "实时",
    disconnected: "连接断开",
    sessions24h: "24h 内会话",
    generating: "生成中",
    active10m: "活跃(10 分钟内)",
    allOutput: "各会话累计输出",
    sessionUnit: "个",
    waiting: "等待数据…",
    active: "活跃",
    idle: "空闲",
    turnRate: "本轮即时速率",
    segmentRate: "最近一段速率",
    performanceDetails: "性能详情",
    contextUsage: "Context 占用",
    recentAvg: "近段均值",
    recentPeak: "近段峰值",
    sessionOutput: "会话累计输出",
    requests: "会话请求数",
    requestUnit: "次",
    chart: "生成速率曲线",
    resources: "本机资源",
    resourcesStale: "本机资源（上次读取）",
    resourcesUnavailable: "本机资源暂时无法读取",
    memory: "内存",
    uptime: "运行",
    footer: "每秒刷新 · 数据源:ZCode usage 数据库(真实)· 各会话独立统计 · 隐藏标签页时自动暂停",
    noSessions: "暂无会话统计",
    noRequests: "该会话还没有已完成的模型请求",
    waitingSamples: "样本不足，等待更多请求完成…",
    noSamples: "暂无速率样本",
    first: "首字",
    output: "输出",
    reasoning: "思考",
    generation: "生成",
    completedAt: "完成时间",
    peak: "峰",
    recentSegments: (n) => `近 ${n} 段`,
    hours: (n) => `${n} 小时`,
    cores: (n) => `${n} 核`,
  },
  "en-US": {
    title: "Token Rate by Session · Azhou Agent Workbench",
    heading: "Azhou Agent Workbench",
    turnDuration: "Turn duration",
    night: "🌙 Night",
    day: "☀️ Day",
    switchNight: "Switch to night mode",
    switchDay: "Switch to day mode",
    connecting: "Connecting",
    live: "Live",
    disconnected: "Disconnected",
    sessions24h: "Sessions (24h)",
    generating: "Generating",
    active10m: "Active (10 min)",
    allOutput: "Total output",
    sessionUnit: "",
    waiting: "Waiting for data…",
    active: "Active",
    idle: "Idle",
    turnRate: "Current turn rate",
    segmentRate: "Latest segment rate",
    performanceDetails: "Performance details",
    contextUsage: "Context usage",
    recentAvg: "Recent average",
    recentPeak: "Recent peak",
    sessionOutput: "Session output",
    requests: "Session requests",
    requestUnit: "",
    chart: "Generation rate",
    resources: "System resources",
    resourcesStale: "System resources (last reading)",
    resourcesUnavailable: "System resources unavailable",
    memory: "Memory",
    uptime: "Uptime",
    footer: "Updates every second · ZCode usage database · Per-session stats · Pauses when hidden",
    noSessions: "No session data",
    noRequests: "No model requests have completed in this session",
    waitingSamples: "Waiting for more samples…",
    noSamples: "No rate samples",
    first: "TTFT",
    output: "Output",
    reasoning: "reasoning",
    generation: "Generation",
    completedAt: "Completed at",
    peak: "Peak",
    recentSegments: (n) => `Last ${n} ${n === 1 ? "segment" : "segments"}`,
    hours: (n) => `${n} h`,
    cores: (n) => `${n} ${n === 1 ? "core" : "cores"}`,
  },
};
let language = "zh-CN", copy = translations[language];
let lastSessions, lastSystem, connection = "connecting";

/* ---------- 日间/夜间主题 ---------- */
const themeBtn = $("themeBtn");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "light" ? copy.night : copy.day;
  themeBtn.title = t === "light" ? copy.switchNight : copy.switchDay;
}
let theme = document.documentElement.dataset.theme === "light" ? "light" : "dark";
applyTheme(theme);
themeBtn.addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  try { localStorage.setItem("zcode-tps-theme", theme); } catch {}
  applyTheme(theme);
  chartSig = ""; drawChart(); // 曲线颜色随主题重取
});

const fmtCompact = (n) => {
  if (n == null) return "--";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e4) return Math.round(n / 1e3) + "k";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
};
const fmtNum = (n) => (n == null ? "--" : Number(n).toLocaleString("en-US"));
const hhmmss = (t) => new Date(t).toLocaleTimeString(language, { hourCycle: "h23" });
const rate1 = (v) => (v == null ? "--" : Number(v).toFixed(1));
const withUnit = (value, unit) => unit ? value + "<i>" + unit + "</i>" : String(value);

function sessionRate(s) {
  if (s.requestRate != null) return s.requestRate;
  if (s.turn && s.turn.tokPerSec != null) return s.turn.tokPerSec;
  if (s.latest && s.latest.tokPerSec != null) return s.latest.tokPerSec;
  return null;
}

/* ---------- 聚焦详情 ---------- */
let chartHist = [], chartSig = "", detailSig = "";

// 画布取色:每次绘制现读 CSS 变量,主题切换即生效(不缓存,避免主题状态滞留)
function chartPalette() {
  const s = getComputedStyle(document.documentElement);
  return {
    grid: s.getPropertyValue("--chart-grid").trim() || "rgba(255,255,255,.06)",
    label: s.getPropertyValue("--chart-label").trim() || "rgba(178,188,208,.9)",
    empty: s.getPropertyValue("--chart-empty").trim() || "rgba(154,164,187,.55)",
    soft: s.getPropertyValue("--chart-soft").trim() || "rgba(52,211,153,.28)",
    avg: s.getPropertyValue("--chart-avg").trim() || "rgba(96,165,250,.5)",
    line: s.getPropertyValue("--em").trim() || "#34d399",
  };
}

function drawChart() {
  const canvas = $("chart"), dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const pal = chartPalette();
  const data = chartHist.filter((v) => v != null);
  if (data.length < 2) {
    ctx.fillStyle = pal.empty; ctx.font = "12px " + getComputedStyle(document.body).fontFamily;
    ctx.fillText(data.length ? copy.waitingSamples : copy.noSamples, 12, h / 2);
    return;
  }
  const right = 46, top = 10, bottom = 18;
  let min = 0, max = Math.max(...data);
  const pad = (max - min) * 0.12 || 1; max += pad;
  const x = (i) => (i / (data.length - 1)) * (w - right);
  const y = (v) => h - bottom - ((v - min) / (max - min)) * (h - top - bottom);
  ctx.strokeStyle = pal.grid; ctx.fillStyle = pal.label; ctx.lineWidth = 1;
  ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
  for (let g = 0; g <= 3; g++) {
    const gy = top + ((h - top - bottom) * g) / 3;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w - right, gy); ctx.stroke();
    ctx.fillText(Math.round(max - ((max - min) * g) / 3), w - right + 8, gy + 3);
  }
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, pal.soft); grad.addColorStop(1, pal.soft.replace(/,\s*[\d.]+\)$/, ",0)")); // 同色透明收尾
  ctx.beginPath();
  data.forEach((v, i) => { const px = x(i), py = y(v); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.lineTo(x(data.length - 1), h - bottom); ctx.lineTo(x(0), h - bottom); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath();
  data.forEach((v, i) => { const px = x(i), py = y(v); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.strokeStyle = pal.line; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
  const avg = data.reduce((a, b) => a + b, 0) / data.length;
  ctx.beginPath(); ctx.setLineDash([4, 4]); ctx.strokeStyle = pal.avg; ctx.lineWidth = 1;
  ctx.moveTo(0, y(avg)); ctx.lineTo(w - right, y(avg)); ctx.stroke(); ctx.setLineDash([]);
  const lx = x(data.length - 1), ly = y(data[data.length - 1]);
  ctx.beginPath(); ctx.arc(lx, ly, 3.2, 0, Math.PI * 2); ctx.fillStyle = pal.line; ctx.fill();
  ctx.beginPath(); ctx.arc(lx, ly, 7, 0, Math.PI * 2); ctx.strokeStyle = pal.soft; ctx.stroke();
}

function renderDetail(s) {
  const hasSession = Boolean(s);
  s ??= { label: copy.noSessions, sessionId: "", status: "idle" };
  $("dName").textContent = s.label;
  $("dModel").textContent = s.model ? "· " + s.model : "";
  const directory = $("dDir");
  const location = s.cwd || s.sessionId;
  if (directory.textContent !== location) directory.textContent = location;
  directory.hidden = !location;
  const st = $("dState");
  st.hidden = !hasSession;
  st.className = "state " + (s.status === "generating" ? "gen" : s.status === "active" ? "act" : "idl");
  st.textContent = hasSession ? (copy[s.status] || s.status) : "";
  const r = sessionRate(s);
  const big = $("dRate");
  setText("dRate", r == null ? "—" : rate1(r));
  $("dRateUnit").hidden = r == null;
  const sec = ms => Number.isFinite(ms) ? (ms / 1000).toFixed(1) + " s" : "—";
  document.querySelector(".hero").hidden = !Number.isFinite(r) && !Number.isFinite(s.turn?.totalMs);
  $("dDuration").textContent = sec(s.turn?.totalMs);
  big.className = "big" + (s.status === "idle" ? " idl" : "");
  $("dCap").textContent = s.requestRateEstimated ? (language === "zh-CN" ? "流式估算" : "Live estimate") : (s.requestRate != null || !s.turn ? copy.segmentRate : copy.turnRate);

  const rows = [];
  const addMetric = (label, value, format) => {
    if (Number.isFinite(value)) rows.push([label, format(value)]);
  };
  const tokens = v => fmtNum(v) + " tok";
  const rate = v => rate1(v) + " tok/s";
  if (s.turn) {
    const t = s.turn;
    const zh = language === "zh-CN";
    addMetric(copy.first, t.ttftMs, sec);
    if (t.genMs > 0) addMetric(copy.generation, t.genMs, sec);
    addMetric(copy.output, t.totalOutput, tokens);
    addMetric(copy.reasoning, t.totalReasoning, tokens);
    addMetric(zh ? "请求段数" : "Request segments", t.requests, fmtNum);
    if (t.rated) addMetric(copy.peak, t.peak, rate);
    if (s.requestRate != null) {
      const label = s.composerTurn ? (zh ? "有效段均速" : "Mean rated segment speed") : (zh ? "整轮生成均速" : "Turn generation rate");
      addMetric(label, t.tokPerSec, rate);
    }
  } else if (s.latest) {
    addMetric(copy.output, s.latest.outputTokens, tokens);
    addMetric(copy.generation, s.latest.genMs, sec);
    addMetric(copy.completedAt, s.latest.completedAt, hhmmss);
  }

  addMetric(copy.contextUsage, s.contextUsagePercent, v => fmtNum(v) + "%");

  const details = $("performanceDetails");
  details.hidden = rows.length === 0;
  $("dEmpty").hidden = !hasSession || Boolean(s.turn || s.latest);
  const nextDetailSig = JSON.stringify([s.sessionId, rows]);
  if (detailSig !== nextDetailSig) {
    detailSig = nextDetailSig;
    const list = document.createElement("dl");
    for (const [label, value] of rows) {
      const term = document.createElement("dt"), detail = document.createElement("dd");
      term.textContent = label; detail.textContent = value; list.append(term, detail);
    }
    $("dSub").replaceChildren(list);
  }
  const ses = s.session;
  $("cAvg").textContent = ses && ses.avg != null ? rate1(ses.avg) : "--";
  $("cMax").textContent = ses && ses.max != null ? rate1(ses.max) : "--";
  $("cCum").innerHTML = ses ? fmtCompact(ses.totalOutput + ses.totalReasoning) + "<i>tok</i>" : "--";
  $("cReq").innerHTML = ses ? withUnit(fmtNum(ses.requests), copy.requestUnit) : "--";
  chartHist = s.history || [];
  const showHistory = Boolean(ses) || chartHist.some(Number.isFinite);
  document.querySelector(".session-history").hidden = !showHistory;
  const sig = JSON.stringify([s.sessionId, showHistory, chartHist]);
  if (sig !== chartSig) { chartSig = sig; drawChart(); $("chartCap").textContent = copy.recentSegments(chartHist.filter((v) => v != null).length); }
}

function renderConnection() {
  $("live").dataset.state = connection;
  setText("liveTxt", copy[connection]);
}

function syncHostLanguage() {
  const locale = window.zcode?.locale;
  if (!locale) return;
  const next = /^zh(?:[-_]|$)/i.test(locale) ? "zh-CN" : "en-US";
  if (next === language) return;
  language = next;
  copy = translations[language];
  document.documentElement.lang = language;
  document.title = copy.title;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = copy[node.dataset.i18n];
  applyTheme(theme);
  renderConnection();
  chartSig = "";
  if (lastSessions) renderSessions(lastSessions);
  if (!chartSig) drawChart();
  if (lastSystem) renderSystem(lastSystem);
  renderResourceStatus();
  clock();
}

/* ---------- 轮询 ---------- */
let languageHost;
async function readDashboardData(name, signal) {
  const host = window.zcode;
  if (host?.callTool) {
    if (host !== languageHost) {
      languageHost = host;
      host.subscribe?.(syncHostLanguage);
    }
    await host.ready();
    signal?.throwIfAborted();
    syncHostLanguage();
    const result = await host.callTool(name, {});
    if (result.isError || !result.structuredContent) throw new Error("Dashboard data unavailable");
    return result.structuredContent;
  }
  const res = await fetch("/api/" + name, { cache: "no-store", signal });
  if (!res.ok) throw new Error("Dashboard data unavailable");
  return res.json();
}

async function loadArtwork() {
  try {
    const { portrait, wallpaper } = window.zcode?.callTool
      ? await readDashboardData("artwork")
      : { portrait: "./azhou.webp", wallpaper: "./wallpaper.webp" };
    const img = $("brandPortrait");
    img.addEventListener("load", () => { img.hidden = false; }, { once: true });
    img.src = portrait;
    document.body.style.setProperty("--wallpaper", "url(" + JSON.stringify(wallpaper) + ")");
  } catch {}
}

function renderSessions(r) {
  const list = r.sessions || [];
  renderDetail(r.focusedSessionId ? r.focusedSession : list[0]);
  document.querySelector(".stats").hidden = false;
  const gen = list.filter((x) => x.status === "generating").length;
  const act = list.filter((x) => x.status !== "idle").length;
  $("sTotal").innerHTML = withUnit(r.total ?? list.length, copy.sessionUnit);
  $("sGen").innerHTML = withUnit(gen, copy.sessionUnit);
  $("sAct").innerHTML = withUnit(act, copy.sessionUnit);
  let cum = 0; for (const s of list) if (s.session) cum += s.session.totalOutput + s.session.totalReasoning;
  $("sCum").innerHTML = fmtCompact(cum) + "<i>tok</i>";
}

function renderSystem(system) {
  $("cpu").textContent = Number.isFinite(system.cpuPercent) ? system.cpuPercent.toFixed(1) + "%" : "—";
  setBar($("cpuBar"), system.cpuPercent);
  $("mem").textContent = (system.memUsedMB / 1024).toFixed(1) + " / " + (system.memTotalMB / 1024).toFixed(0) + " GB";
  setBar($("memBar"), system.memPercent);
  $("up").textContent = Number.isFinite(system.hostUptimeHours) ? copy.hours(system.hostUptimeHours) : "—";
  $("plat").textContent = system.platform + " · " + copy.cores(system.cpuCores);
}

function setText(id, text) {
  const label = $(id);
  if (label.textContent !== text) label.textContent = text;
}

let resourcesStale = false;
function renderResourceStatus() {
  $("sys").hidden = !lastSystem && !resourcesStale;
  $("resourceReadings").hidden = !lastSystem;
  const label = lastSystem ? (resourcesStale ? copy.resourcesStale : copy.resources) : copy.resourcesUnavailable;
  setText("resourceStatus", label);
}

function poll(name, interval, receive, onError) {
  let pending = false;
  let scheduled;
  return async function tick() {
    if (pending) return;
    clearTimeout(scheduled);
    if (document.hidden) return;
    pending = true;
    const controller = new AbortController();
    let timeout;
    try {
      const deadline = new Promise((_, reject) => {
        timeout = setTimeout(() => {
          controller.abort();
          reject(new Error("Dashboard request timed out"));
        }, 5000);
      });
      receive(await Promise.race([readDashboardData(name, controller.signal), deadline]));
    } catch {
      onError();
    } finally {
      clearTimeout(timeout);
      pending = false;
      if (!document.hidden) scheduled = setTimeout(tick, interval);
    }
  };
}

const tickSessions = poll("sessions", 1000, result => {
  renderSessions(result);
  lastSessions = result;
  connection = "live";
  renderConnection();
}, () => {
  connection = "disconnected";
  renderConnection();
});

const tickSys = poll("metrics", 2000, ({ system }) => {
  renderSystem(system);
  lastSystem = system;
  resourcesStale = false;
  renderResourceStatus();
}, () => {
  resourcesStale = true;
  renderResourceStatus();
});

function setBar(el, pct) {
  const v = Math.min(100, Math.max(0, pct ?? 0));
  el.firstElementChild.style.transform = `scaleX(${v / 100})`;
  el.className = "meter" + (v > 85 ? " crit" : v > 65 ? " warn" : "");
}

function clock() { $("clock").textContent = hhmmss(Date.now()); }
let resizeFrame = 0;
window.addEventListener("resize", () => {
  if (resizeFrame) return;
  resizeFrame = requestAnimationFrame(() => {
    resizeFrame = 0;
    drawChart();
  });
});

function refreshVisibleData() {
  tickSessions();
  tickSys();
}
document.addEventListener("visibilitychange", refreshVisibleData);
clock();
loadArtwork();
refreshVisibleData();
setInterval(clock, 1000);
</script>
