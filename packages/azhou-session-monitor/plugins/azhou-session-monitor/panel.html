<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>阿舟的会话仪表</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui,sans-serif;--ink:light-dark(#33281f,#f3eee8);--muted:light-dark(#655d53,#bdb8b2);--accent:light-dark(#8e470c,#ffc185)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:light-dark(#faf8f4,#1a2027)}main{max-width:36rem;margin:auto;padding:0 18px 16px}header img{width:100%;height:85px;object-fit:cover;object-position:50% 46%;border-radius:8px}h1{font-size:1.35rem;margin:14px 0 4px}p{color:var(--muted);margin:4px 0 12px}dl{margin:0}dl div{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:7px 0;border-bottom:1px solid color-mix(in srgb,currentColor 16%,transparent)}dd{margin:0;font-variant-numeric:tabular-nums}dt{color:var(--muted)}.rate{color:var(--accent);font-size:1.45rem}button{font:inherit;border:1px solid currentColor;border-radius:6px;padding:4px 12px;background:transparent;color:var(--ink)}button:focus-visible{outline:3px solid var(--accent)}small{display:block;margin:14px 0;color:var(--muted);font-size:10px}
</style>
<main><header><img alt="" src="data:image/webp;base64,__ART__"><h1>阿舟的会话仪表</h1></header>
<p id="state" role="status">正在读取当前会话…</p><dl id="rows"></dl><button type="button" id="refresh">刷新本轮数据</button>
<small>Azhou artwork © 小亮（阿舟 / Azhou） · CC BY-NC-ND 4.0</small></main>
<script>
const notices={unbound:"宿主未提供可核对的会话身份。",unavailable:"未找到唯一匹配的本地会话记录。",running:"本轮进行中，等待完整统计。",interrupted:"本轮已中断。",complete:"最近完成的一轮",empty:"此会话尚无可用的轮次统计。"};
const rows=document.querySelector("#rows"),state=document.querySelector("#state"),refresh=document.querySelector("#refresh");
const seconds=n=>n<60000?(n/1000).toFixed(1)+" 秒":Math.floor(n/60000)+" 分 "+((n%60000)/1000).toFixed(1)+" 秒";
function show(result){
 const d=result?.structuredContent;
 rows.replaceChildren();
 state.textContent=notices[d?.state]||"尚未收到宿主数据。";
 const s=d?.state==="complete"?d:d?.lastCompleted;
 if(!s)return;
 if(d.state!=="complete")state.textContent+=" 以下是上一已完成轮。";
 for(const [label,key,format] of [["整轮输出吞吐","effectiveTps",n=>n+" tok/s"],["首个 token 等待","ttftMs",seconds],["整轮用时（含工具）","durationMs",seconds],["模型响应数","responses",String],["输出 tokens","outputTokens",n=>n.toLocaleString()],["本轮输入缓存命中","cacheHitPercent",n=>n+"%"]]){
  const row=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");
  dt.textContent=label;dd.textContent=Number.isFinite(s[key])?format(s[key]):"—";if(key==="effectiveTps")dd.className="rate";row.append(dt,dd);rows.append(row);
 }
}
let seq=0,ready=false;const pending=new Map();
function rpc(method,params){
 const id=++seq;return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{pending.delete(id);reject(Error("timeout"))},8000);
  pending.set(id,{resolve,reject,timer});
  parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
 });
}
window.addEventListener("message",e=>{
 if(e.source!==parent||e.data?.jsonrpc!=="2.0")return;
 const m=e.data;
 if(m.method==="ui/notifications/tool-result")show(m.params);
 const p=pending.get(m.id);if(!p)return;
 clearTimeout(p.timer);pending.delete(m.id);if(m.error)p.reject(Error("host"));else p.resolve(m.result);
});
window.addEventListener("openai:set_globals",e=>{
 const data=e.detail?.globals?.toolOutput;if(data)show({structuredContent:data});
});
async function update(){
 refresh.disabled=true;
 try{if(ready)show(await rpc("tools/call",{name:"session_performance",arguments:{}}));
 else if(window.openai?.callTool)show(await window.openai.callTool("session_performance",{}));
 else throw Error("offline");}
 catch{show(null);state.textContent="宿主暂时无法刷新会话数据。";}finally{refresh.disabled=false;}
}
refresh.onclick=update;
if(window.openai?.toolOutput)show({structuredContent:window.openai.toolOutput});
if(parent!==window)rpc("ui/initialize",{appInfo:{name:"azhou-session-monitor",version:"0.1.0"},protocolVersion:"2026-01-26",appCapabilities:{}}).then(()=>{
 ready=true;parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");
}).catch(()=>{if(!window.openai?.toolOutput&&!rows.childElementCount)show(null)});
else show(null);
</script></html>
